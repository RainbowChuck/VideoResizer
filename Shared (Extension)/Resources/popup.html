<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, sans-serif;
            width: 240px;
            padding: 16px;
        }
        h3 { margin-top: 0; }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
        }
        button.active {
            background: #007aff;
            color: white;
        }
    </style>
</head>
<body>
    <h3>Video Resizer</h3>
    <button data-mode="auto">Авто — 100%</button>
    <button data-mode="compact">Компактный — 75%</button>
    <button data-mode="off">Выключить</button>
    <script src="popup.js"></script>
</body>
</html>
